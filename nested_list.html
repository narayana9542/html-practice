<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Nesting Lists</title>
</head>
<body>
   
    <h1> My Day</h1>

    <h2> Todays Plan</h2>

    <ol>
        <li>Morning
            <ul>
                <li> Wake Up</li>
                <li> Drink Coffee</li>
            </ul>
        </li>

        <li>Afternoon
            <ol>
                <li> Eat Lunch</li>
                <li> Work on Project</li>
            </ol>
        </li>

        <li>Evening
            <ol>
                <li> Reading Book</li>
                <li> Go to Sleep</li>
            </ol>
        </li>
    </ol>
</body>
</html>
